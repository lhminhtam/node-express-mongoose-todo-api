name: node-express-mongoose-todo-api CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:latest
        ports:
          - "27017:27017"
        options: >-
          --health-cmd "mongo --eval 'db.runCommand({ ping: 1 })'" 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          DB_TEST: mongodb://localhost:27017/TodoApiTest
          JWT_SECRET: todoapisecret
          PORT: 3000
          NODE_ENV: test

  build-and-push:
    needs: build-and-test
    ## Chỉ push khi merge/push vào main, PR thì không cần push image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build và Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tận dụng cache của Docker Hub để build nhanh hơn
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/todo-api:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/todo-api:buildcache,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:${{ github.sha }}
